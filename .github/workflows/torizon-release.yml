name: Build and release Torizon
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.1.2
        required: true
      reuse_game_from_run:
        description: Optional successful game build run with identical engine sources
        default: ''
        required: false
      draft:
        description: Keep a new release as a draft for artifact verification
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

env:
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '-C target-feature=+crt-static'
  HORIZON_VERSION: 'Torizon 0.1.2'
  HORIZON_LAUNCHER_VERSION: '0.1.2'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        component: ${{ inputs.reuse_game_from_run != '' && fromJSON('["launcher"]') || fromJSON('["launcher","game"]') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.component == 'launcher' && 'launcher -> target' || '. -> target' }}
          shared-key: torizon-windows-${{ matrix.component }}
      - name: Build launcher
        if: matrix.component == 'launcher'
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path launcher/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --manifest-path launcher/Cargo.toml --lib account::tests::the_developer_option
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --manifest-path launcher/Cargo.toml --lib torizon::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist/Torizon -Force | Out-Null
          Copy-Item launcher/target/release/horizon-launcher.exe dist/Torizon/Torizon.exe
      - name: Build Rust game and prepare tools
        if: matrix.component == 'game'
        shell: pwsh
        run: |
          python tools/bench_page_runs.py --test-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p horizon-client -p horizon-client-lib --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scratch = Join-Path $env:RUNNER_TEMP ('torizon-tests-' + [guid]::NewGuid())
          foreach ($key in @('HORIZON_HOME','HORIZON_LAUNCHER_HOME','XDG_DATA_HOME','XDG_CONFIG_HOME','HORIZON_LAUNCHER_TRASH','HORIZON_LAUNCHER_CLIPBOARD','HORIZON_LAUNCHER_DESKTOP')) {
            [Environment]::SetEnvironmentVariable($key, (Join-Path $scratch $key), 'Process')
          }
          $env:HORIZON_NO_AUDIO = '1'
          $env:HORIZON_LAUNCHER_NO_SELF_UPDATE = '1'
          cargo test --locked --release -p horizon-threads --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release -p horizon-client-render --lib streaming::tests::remote_dirty_masks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release -p horizon-client --lib game::remote_chunks::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_torizon.py --game-bin target/release --output dist/Torizon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: torizon-${{ matrix.component }}
          path: dist/Torizon/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: torizon-*
          path: dist/Torizon
          merge-multiple: true
      - name: Validate the reused engine source
        if: inputs.reuse_game_from_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.reuse_game_from_run }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid source run' }
          gh run watch $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceSha = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" --jq .head_sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tree = gh api "repos/$env:GITHUB_REPOSITORY/git/trees/$sourceSha" | ConvertFrom-Json
          foreach ($path in @('crates', 'mods', 'Cargo.toml', 'Cargo.lock')) {
            $old = ($tree.tree | Where-Object path -eq $path).sha
            $current = git rev-parse "HEAD:$path"
            if ($old -ne $current) { throw "Engine source changed: $path. Build a new game instead of reusing it." }
          }
      - uses: actions/download-artifact@v4
        if: inputs.reuse_game_from_run != ''
        with:
          name: torizon-game
          path: dist/Torizon
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_game_from_run }}
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a version tag such as v0.1.0' }
          Set-Content dist/Torizon/runtime/.installed 'Torizon 0.1.2' -Encoding ascii
          Copy-Item TORIZON.md dist/Torizon/TORIZON.md -Force
          Compress-Archive -Path dist/Torizon -DestinationPath dist/Torizon-Windows-x64.zip
          python tools/package_torizon_exe.py --launcher dist/Torizon/Torizon.exe --runtime dist/Torizon/runtime --output dist/Torizon.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @('dist/Torizon-Windows-x64.zip', 'dist/Torizon.exe')
          $files | ForEach-Object { $h = Get-FileHash $_ -Algorithm SHA256; '{0}  {1}' -f $h.Hash.ToLower(),(Split-Path $_ -Leaf) } | Set-Content dist/SHA256SUMS -Encoding ascii
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            $draft = @()
            if ($env:RELEASE_DRAFT -eq 'true') { $draft = @('--draft') }
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Torizon $env:RELEASE_TAG — Windows x64" --notes-file TORIZON.md @draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG dist/Torizon-Windows-x64.zip dist/Torizon.exe dist/SHA256SUMS --repo $env:GITHUB_REPOSITORY --clobber
          exit $LASTEXITCODE
